# One bounded Gradle process per CI job: preserve all mandatory tasks while
# avoiding multiple large Kotlin daemons on the shared VPS runner.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official
