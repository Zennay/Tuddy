name: Android APK (hosted)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: tuddy-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    if: ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify proposed-merge checkout identity without credentials
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
      - name: Test fail-closed workflow identity before untrusted Gradle code
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Hosted Ubuntu runners ship the Android command-line SDK; this avoids
      # competing with Tuddy/zCloud workloads on the overloaded VPS. The old
      # setup-android action requests the removed 'tools' SDK package and fails.
      - name: Resolve installed Android SDK on hosted runner
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          test -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
      - name: Check Android SDK environment
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || command -v sdkmanager
      - name: Install Android 35 SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify unit tests and build APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: Reject unexpected permissions or exported components in built APK
        run: python3 -B tools/check_android_apk_manifest.py "app/build/outputs/apk/debug/app-debug.apk"
      - name: Verify APK digest and bind artifact to built checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          out="app/build/outputs/apk/debug"
          test -s "$out/app-debug.apk"
          (cd "$out" && sha256sum app-debug.apk > app-debug.apk.sha256 && sha256sum --check app-debug.apk.sha256)
          git rev-parse HEAD > "$out/source-commit.txt"
          test "$(cat "$out/source-commit.txt")" = "$EXPECTED_SHA"
          cat "$out/app-debug.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Tuddy-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/source-commit.txt
          retention-days: 14
          if-no-files-found: error

  # Independent immutable contributor HEAD evidence. The primary build job
  # intentionally continues validating GitHub's proposed PR merge tree.
  source-head:
    if: (github.event_name == 'pull_request') && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Run offline workflow-identity regressions
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - name: Verify exact immutable contributor revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Resolve installed Android SDK on hosted runner
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          test -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
      - name: Ensure Android 35 SDK
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || command -v sdkmanager
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate lifecycle policy on exact source HEAD
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon
